spring.application.name=online-shop

# Filled in by Maven from the active build profile (dev / test / prod)
spring.profiles.active=@app.profile@

server.port=8080

# Return the "message" of exceptions in our own error body only, never stack traces
server.error.include-stacktrace=never

# PostgreSQL; the defaults match the local database from README, env variables override them
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/online_shop}
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:shop}

# Flyway owns the schema (db/migration); Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Lazy data is loaded inside service transactions only, never while the HTTP response is written
spring.jpa.open-in-view=false
# Lazy data of a page (product categories, order items) is loaded with one IN (...) query instead of N queries
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Paging: ?size=500 is reduced to 100, so a client can never ask for the whole table
spring.data.web.pageable.max-page-size=100

# Practice 5: cache the category list in Caffeine, bounded by size and time so it never grows forever
# and a stale entry cannot live longer than the TTL even if an eviction is ever missed
spring.cache.type=caffeine
spring.cache.cache-names=categories
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

app.shop.currency=KZT
app.shop.max-items-per-order=20

# Practice 6: external exchange-rate service with short timeouts and last-known fallback rates.
# If the service is slow or down, the call fails fast and the service layer answers from fallbackRates.
app.exchange.base-url=https://open.er-api.com/v6/latest
app.exchange.base-currency=KZT
app.exchange.connect-timeout=2s
app.exchange.read-timeout=2s
app.exchange.fallback-rates.USD=0.0019
app.exchange.fallback-rates.EUR=0.0017
app.exchange.fallback-rates.RUB=0.17

# SIS 3: retry + circuit breaker for the same call (lecture week 10, slides 24-25), used by
# @Retry / @CircuitBreaker(name = "exchangeRate") on ExchangeRateService.rateFor.
# Only transient faults count: an I/O error or timeout (ResourceAccessException) and a 5xx answer.
# A 4xx means our request is wrong, so it is neither retried nor counted against the remote service.
resilience4j.retry.instances.exchangeRate.max-attempts=3
resilience4j.retry.instances.exchangeRate.wait-duration=200ms
resilience4j.retry.instances.exchangeRate.enable-exponential-backoff=true
resilience4j.retry.instances.exchangeRate.exponential-backoff-multiplier=2
resilience4j.retry.instances.exchangeRate.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.exchangeRate.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException

# Open the breaker when half of the last 10 calls (at least 5) failed or took longer than 1.5 s;
# stay open for 10 s (every call goes straight to the fallback), then let 3 trial calls through.
resilience4j.circuitbreaker.instances.exchangeRate.sliding-window-size=10
resilience4j.circuitbreaker.instances.exchangeRate.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.exchangeRate.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.exchangeRate.slow-call-duration-threshold=1500ms
resilience4j.circuitbreaker.instances.exchangeRate.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.exchangeRate.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.exchangeRate.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.exchangeRate.record-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.exchangeRate.record-exceptions[1]=org.springframework.web.client.HttpServerErrorException

# SIS 3: event-driven communication with Apache Kafka (lecture week 11).
# If no broker is running the application still starts; the producer and consumer simply stay idle.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer: JSON values, keyed by order id; acks=all so a write is confirmed by the replicas
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

# Consumer: read from the start for a new group; a bad record becomes an error (then the DLT), not a crash loop
spring.kafka.consumer.group-id=order-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Only our own event classes may be built from an incoming JSON message
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.shop.order.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.shop.order.events.OrderPlaced

# Practice 7: JWT access tokens (lecture week 12, slides 20-22). Short-lived, because a JWT cannot be revoked.
# No key files here: dev and test generate a key pair at start-up; prod reads both from the environment.
app.jwt.issuer=online-shop
app.jwt.access-token-ttl=15m
