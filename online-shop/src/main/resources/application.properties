spring.application.name=online-shop

# Filled in by Maven from the active build profile (dev / test / prod)
spring.profiles.active=@app.profile@

server.port=8080

# Return the "message" of exceptions in our own error body only, never stack traces
server.error.include-stacktrace=never

app.shop.currency=KZT
app.shop.max-items-per-order=20
app.shop.seed-data=false
