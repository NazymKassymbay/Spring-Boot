spring.application.name=online-shop

# Filled in by Maven from the active build profile (dev / test / prod)
spring.profiles.active=@app.profile@

server.port=8080

# Return the "message" of exceptions in our own error body only, never stack traces
server.error.include-stacktrace=never

# PostgreSQL; the defaults match the local database from README, env variables override them
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/online_shop}
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:shop}

# Flyway owns the schema (db/migration); Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Lazy data is loaded inside service transactions only, never while the HTTP response is written
spring.jpa.open-in-view=false
# Lazy collections (order items) of a page of entities are loaded with one IN query instead of N queries
spring.jpa.properties.hibernate.default_batch_fetch_size=50

app.shop.currency=KZT
app.shop.max-items-per-order=20
