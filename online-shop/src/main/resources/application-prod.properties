# Prod: database settings must come from the environment (no defaults), no demo data, quiet logs
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Practice 7: the JWT key pair must come from outside Git, e.g. JWT_PRIVATE_KEY=file:/run/secrets/jwt-private.pem.
# No defaults: a missing key stops start-up instead of signing tokens with a throw-away key (lecture week 12, slide 27)
app.jwt.public-key=${JWT_PUBLIC_KEY}
app.jwt.private-key=${JWT_PRIVATE_KEY}
logging.level.root=WARN
logging.level.com.example.shop=INFO
